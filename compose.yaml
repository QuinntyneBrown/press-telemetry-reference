name: press-telemetry-reference

# Exactly three external infrastructure services (L2-017): MQTT broker, Couchbase, Redis.
# Committed credentials are well-known local development values only (L2-018).
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok -q 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  couchbase:
    image: couchbase:enterprise-7.6.4
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      retries: 30

  couchbase-init:
    image: couchbase:enterprise-7.6.4
    depends_on:
      couchbase:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init-couchbase.sh"]
    volumes:
      - ./infra/couchbase/init-couchbase.sh:/init/init-couchbase.sh:ro

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  couchbase-data:
